<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fotoalbum på TV</title>
    <link rel="stylesheet" href="tv.css" />
  </head>
  <body>
    <!-- Koden mobilen skal skrive inn -->
    <div id="pair" class="screen">
      <p id="pair-title" class="title">Fotoalbum</p>
      <p class="steps">Åpne albumet på mobilen, trykk <strong>Vis på TV</strong> og skriv inn koden</p>
      <p id="code" class="code">····</p>
      <p id="pair-status" class="status">Henter kode …</p>
    </div>

    <!-- Bildene -->
    <div id="show" class="screen" hidden>
      <img id="img-a" class="photo" alt="" />
      <img id="img-b" class="photo" alt="" />
      <p id="caption" class="caption"></p>
      <p id="notice" class="notice"></p>
    </div>

    <script src="config.js"></script>
    <script src="tv.js"></script>
  </body>
</html>
